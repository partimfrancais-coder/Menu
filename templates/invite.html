<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Menu Studio</title><link rel="stylesheet" href="/styles.css"><script defer src="/invite.js"></script></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">KOI</div><h1>Join Menu Studio</h1><p>Set your password to accept your invitation. Your invited email address will be your sign-in username.</p>{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/invite"><input type="hidden" id="invite-token" name="token" value="{{ request.form.get('token', '') }}"><label class="field">Create password<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="hint">Use at least 12 characters.</p><button type="submit" class="primary">Accept invitation</button></form><p><a href="/login">Back to sign in</a></p></main></body></html>
