<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Menu Studio</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">KOI</div><div class="eyebrow">RESTAURANT WORKSPACE</div><h1>Menu Studio</h1><p>Sign in to manage your restaurants and menus.</p>{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><label class="field">Username<input name="username" autocomplete="username" required autofocus maxlength="100"></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" type="submit">Sign in</button></form></main></body></html>
